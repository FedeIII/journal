services:
  postgres:
    image: postgres:15-alpine
    container_name: journal-db
    environment:
      POSTGRES_DB: journal
      POSTGRES_USER: journal_user
      POSTGRES_PASSWORD: journal_password
    ports:
      - "127.0.0.1:5433:5432"  # Port 5433 avoids a conflict; loopback only, because Docker bypasses ufw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal_user -d journal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
